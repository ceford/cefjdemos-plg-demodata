A couple of terminology notes:

* **Bienenschädlinge** is the natural German term for "Bee Pests" in a beekeeping context.
* **Bienendaten** is concise and suitable for a Joomla field group title.
* **Exemplar** is the usual scientific translation of "specimen"; for a general audience, **Probe** could also be used, but *Exemplar* is better for species data.

